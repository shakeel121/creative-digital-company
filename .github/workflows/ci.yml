name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Generate CycloneDX SBOM (supply-chain artifact)
        run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ matrix.node-version }}
          path: dist/
          if-no-files-found: error

  security:
    name: Security scan (SAST + dependencies + secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate risk-acceptance config (SecLead sign-off gate)
        shell: bash
        run: node scripts/validate-risk-acceptance.js

      - name: SAST (Semgrep, p/ci rules, pinned image)
        shell: bash
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            semgrep/semgrep:1.172.0 \
            semgrep scan --config p/ci --sarif --output /src/semgrep-report.sarif \
            --exclude node_modules --exclude dist --exclude .git /src || true

      - name: Gate SAST findings (fail on critical/high; tracked acceptances only)
        shell: bash
        run: node scripts/sarif-gate.js semgrep-report.sarif

      - name: Upload SAST SARIF
        if: ${{ always() && hashFiles('semgrep-report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-report.sarif

      - name: Dependency scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          skip-dirs: node_modules,dist

      - name: Upload Trivy SARIF
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
