name: Secrets full-history scan

on:
  schedule:
    - cron: '0 4 * * 1' # Monday 04:00 UTC — weekly full-history audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-full-history:
    name: Gitleaks full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan full git history (gitleaks git, pinned image)
        shell: bash
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --source /src --no-banner --redact
